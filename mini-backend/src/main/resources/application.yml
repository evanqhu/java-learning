spring:
  application:
    name: java-learning-mini-backend
  datasource:
    url: jdbc:h2:mem:javalearning
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    enabled: true
